name: O2 Clinic Backend Deploy To Staging

on:
  push:
    branches:
      - staging

jobs:
  build-test:
    name: Run build and test source code
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      matrix:
        node-version: ["18.x"]
    steps:
      - uses: actions/checkout@v2
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
          # cache: 'npm'
      
      - name: check folder
        run: ls -la

      - name: Caching node modules # get cache hash file in runner
        id:  node-modules-cache 
        uses: actions/cache@v3
        with:
          path: node_modules
          key:  ${{ github.event.repository.name }}-${{ runner.os }}-node_modules-cache-restore-key-from-package.json-${{ hashFiles('**/package.json') }}
          restore-keys: |
                ${{ github.event.repository.name }}-${{ runner.os }}-node_modules-cache-restore-key-from-package.json-${{ hashFiles('**/package.json') }}
      - name: Install dependencies
        #if cache is true then skip npm i, else run npm i
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: 
          npm install
      - name: Generate prisma
        run: |
          npx prisma generate
      # Build test
      - name: Build
        run: |
          npm run build
      - name: get SHORT_SHA
        id: get_sha
        run: |
          SHORT_SHA=$(git rev-parse --short ${{ github.sha }})
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA"
    outputs:
      SHORT_SHA: ${{ steps.get_sha.outputs.SHORT_SHA }}

  build-and-push-image-docker-to-ghcr:
    name: Build and push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: build-test
    env: 
      SHORT_SHA: ${{ needs.build-test.outputs.SHORT_SHA }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Check repository
        run: ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./docker/staging/Dockerfile 
          push: true
          tags: |
            ghcr.io/colorme-business-development/${{ github.event.repository.name }}-staging:${{ env.SHORT_SHA }}
            ghcr.io/colorme-business-development/${{ github.event.repository.name }}-staging:latest
          # cache-from: type=local,src=/tmp/.buildx-cache
          # cache-to: type=local,dest=/tmp/.buildx-cache-new
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-instance:
    name: Update instances
    runs-on: ubuntu-latest
    needs: build-and-push-image-docker-to-ghcr
    steps:
      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.O2_CLINIC_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.O2_CLINIC_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.O2_CLINIC_REGION }}
      - name: Describe auto scaling group
        run : |
          aws autoscaling describe-auto-scaling-groups --auto-scaling-group-name ${{ vars.O2_CLINIC_STAGING_AUTO_SCALING_GROUP_NAME }} --region ${{ vars.O2_CLINIC_REGION }} > auto-scaling-group.json
          cat auto-scaling-group.json
      - name: Extract instanceId
        uses: sergeysova/jq-action@v2
        id: get-instance-id
        with:
          cmd: jq -r '.AutoScalingGroups[0].Instances[].InstanceId' auto-scaling-group.json 
          multiline: true
      - name: Send command to instances
        run: |
          instanceids="${{ steps.get-instance-id.outputs.value }}"
          for instanceid in $instanceids; do
            echo "Sending command to $instanceid"
            aws ssm send-command --document-name  "AWS-RunShellScript" --instance-ids $instanceid --parameters commands=['cd ${{ vars.O2_CLINIC_WORKDIR_PATH }}','./restart-docker-compose.sh'] --region ${{ vars.O2_CLINIC_REGION }} --output text
          done
